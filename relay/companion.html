<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050807">
<title>Muse Companion</title>
<style>
  :root {
    --bg: #050807; --panel: #0c1210; --line: #1b2622; --text: #d8e6df; --dim: #7f9189;
    --accent: #4dff3c; --hermes: #f2b84b; --beep: #ff9a5c; --warn: #ffcc4d; --bad: #ff5a5a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.45 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px;
    padding-top: max(14px, env(safe-area-inset-top)); }
  .orb { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 35%, #1f2a26, #070b0a 70%); border: 2px solid var(--agent, var(--hermes));
    box-shadow: 0 0 18px -4px var(--agent, var(--hermes)); transition: box-shadow .3s; }
  .orb i { width: 10px; height: 10px; border-radius: 50%; background: var(--agent, var(--hermes)); }
  .orb.busy { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 30px 2px var(--agent, var(--hermes)); } }
  h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  .sub { color: var(--dim); font-size: 12px; }
  .grow { flex: 1; }
  select, button, input, textarea { font: inherit; color: var(--text); }
  select { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
  .cards { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 10px; scrollbar-width: none; }
  .cards::-webkit-scrollbar { display: none; }
  .card { flex: none; min-width: 140px; max-width: 220px; background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--k, var(--accent)); border-radius: 10px; padding: 7px 10px; }
  .card b { display: block; font-size: 10px; letter-spacing: 1.2px; color: var(--k, var(--accent)); }
  .card span { font-size: 13px; }
  main { flex: 1; overflow-y: auto; padding: 6px 16px 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 9px 13px; border-radius: var(--radius); white-space: pre-wrap; word-wrap: break-word; }
  .me { align-self: flex-end; background: #16302a; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .meta { font-size: 11px; color: var(--dim); margin-top: 3px; }
  .me .meta { text-align: right; }
  .status { align-self: flex-start; color: var(--dim); font-size: 13px; font-style: italic; }
  .bot img { display: block; max-width: 100%; border-radius: 10px; margin-top: 8px; }
  .ask { align-self: stretch; border: 1px solid var(--warn); border-radius: var(--radius); padding: 12px; background: #1a160a; }
  .ask code { display: block; margin: 6px 0 10px; color: var(--warn); white-space: pre-wrap; font-size: 13px; }
  .ask .row { display: flex; gap: 8px; }
  .ask button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
  .ask button.yes { border-color: var(--accent); color: var(--accent); }
  .ask button.no { border-color: var(--bad); color: var(--bad); }
  .ask button:disabled { opacity: .4; cursor: default; }
  .card .v { font-size: 18px; font-weight: 600; margin-right: 6px; }
  .card .d { color: var(--dim); font-size: 12px; }
  .empty { margin: auto; text-align: center; color: var(--dim); max-width: 280px; }
  form { display: flex; gap: 8px; align-items: flex-end; padding: 10px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: var(--bg); }
  textarea { flex: 1; resize: none; max-height: 140px; min-height: 44px; padding: 11px 13px; border-radius: 22px;
    border: 1px solid var(--line); background: var(--panel); outline: none; }
  textarea:focus { border-color: var(--agent, var(--hermes)); }
  .icon { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
    cursor: pointer; display: grid; place-items: center; flex: none; }
  .icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon.on { color: var(--agent, var(--hermes)); border-color: var(--agent, var(--hermes)); }
  .send { background: var(--agent, var(--hermes)); color: #071009; border: none; }
  .send:disabled { opacity: .4; }
  #login { position: fixed; inset: 0; background: var(--bg); display: none; place-items: center; padding: 24px; }
  #login.show { display: grid; }
  #login div { width: 100%; max-width: 340px; text-align: center; }
  #login input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); margin: 14px 0 10px; }
  #login button { width: 100%; padding: 12px; border-radius: 12px; border: none; background: var(--accent); color: #071009; font-weight: 600; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<header>
  <div class="orb" id="orb"><i></i></div>
  <div class="grow"><h1 id="name">Muse Companion</h1><div class="sub" id="sub">same conversation as the gadget</div></div>
  <select id="agent" aria-label="Agent"></select>
</header>
<div class="cards" id="cards"></div>
<main id="log"><div class="empty">Say something to Hermes. Replies here are the same conversation the gadget has.</div></main>
<form id="f">
  <button type="button" class="icon" id="speak" title="Read replies aloud" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
  <button type="button" class="icon" id="push" title="Also show my message on the gadget" aria-pressed="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></button>
  <textarea id="t" rows="1" placeholder="Message Hermes…" autocomplete="off"></textarea>
  <button class="icon send" id="go" aria-label="Send">
    <svg viewBox="0 0 24 24"><path d="M5 12h13"/><path d="m12 5 7 7-7 7"/></svg></button>
</form>
<div id="login"><div>
  <h1>Muse Companion</h1>
  <div class="sub">Enter the relay token (the <code>token</code> file next to relay.py).</div>
  <input id="tok" type="password" placeholder="Relay token" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button id="lgo">Connect</button>
</div></div>
<script>
const $ = id => document.getElementById(id);
const COLORS = { default: "var(--hermes)", beepbop: "var(--beep)" };
const KIND = { weather: "#5cc8ff", print: "#ff9a5c", reminder: "#ffcc4d", briefing: "#4dff3c", task: "#c792ff",
               system: "#4dd8c8", alert: "#ff5c5c", note: "#9fb3aa" };
let token = localStorage.getItem("relayToken") || "";
let agents = [], busy = false, shown = new Set(), speak = localStorage.getItem("speak") === "1", push = false;
let audioQ = [], playing = false;

function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function api(path, opt = {}) {
  opt.headers = Object.assign({ "X-Gadget-Token": token }, opt.headers || {});
  return fetch(path, opt).then(r => { if (r.status === 401) { showLogin("That token was not accepted."); throw new Error("401"); } return r; });
}
function showLogin(msg) { $("login").classList.add("show"); $("lerr").textContent = msg || ""; }
function agentName() { return $("agent").value || "default"; }
function label(name) { const a = agents.find(a => a.name === name); return a ? a.label : name; }
function paint() {
  const c = COLORS[agentName()] || "var(--accent)";
  document.documentElement.style.setProperty("--agent", c);
  $("name").textContent = label(agentName());
  $("speak").classList.toggle("on", speak); $("speak").setAttribute("aria-pressed", speak);
  $("push").classList.toggle("on", push); $("push").setAttribute("aria-pressed", push);
}
function time(ts) { return new Date(ts * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
function scroll() { const l = $("log"); l.scrollTop = l.scrollHeight; }
function clearEmpty() { const e = document.querySelector(".empty"); if (e) e.remove(); }
function bubble(cls, text, meta) {
  clearEmpty();
  const b = h("div", "msg " + cls, text);
  if (meta) b.appendChild(h("div", "meta", meta));
  $("log").appendChild(b); scroll(); return b;
}

async function loadAgents() {
  const r = await api("/agents"); const j = await r.json();
  agents = (j.agents || []).filter(a => a.usable !== false);
  const sel = $("agent"); sel.innerHTML = "";
  agents.forEach(a => { const o = h("option", null, a.label); o.value = a.name; sel.appendChild(o); });
  sel.value = localStorage.getItem("agent") || "default"; paint();
}
async function loadHistory() {
  const r = await api("/history?limit=40"); const j = await r.json();
  for (const row of j.history || []) {
    const key = row.heard + "|" + row.reply;   /* text, not time: a live turn and its history row match */
    if (shown.has(key)) continue;
    shown.add(key);
    const where = row.source === "gadget" ? "on the gadget" : "here";
    if (row.heard) bubble("me", row.heard, time(row.ts) + " · " + where);
    if (row.reply) bubble("bot", row.reply, label(row.profile) + (row.mood ? " · " + row.mood : ""));
  }
}
async function loadCards() {
  try {
    const r = await api("/glance"); const j = await r.json();
    const box = $("cards"); box.innerHTML = "";
    for (const c of j.cards || []) {
      const d = h("div", "card"); d.style.setProperty("--k", KIND[c.kind] || KIND.note);
      d.appendChild(h("b", null, c.label || c.title));
      if (c.value) d.appendChild(h("span", "v", c.value));
      d.appendChild(h("span", c.value ? "d" : null, c.detail || c.text)); box.appendChild(d);
    }
  } catch (e) {}
}

function playNext() {
  if (playing || !audioQ.length) return;
  playing = true;
  const a = new Audio("data:audio/mpeg;base64," + audioQ.shift());
  a.onended = a.onerror = () => { playing = false; playNext(); };
  a.play().catch(() => { playing = false; audioQ = []; });
}
function askCard(ask) {
  clearEmpty();
  const box = h("div", "ask");
  box.appendChild(h("div", null, "Hermes wants to run:"));
  box.appendChild(h("code", null, ask.text));
  const row = h("div", "row");
  for (const c of ask.choices || ["once", "deny"]) {
    const b = h("button", c === "deny" ? "no" : "yes", c === "once" ? "Allow once" : c === "deny" ? "Deny" : c[0].toUpperCase() + c.slice(1));
    b.onclick = async () => {
      row.querySelectorAll("button").forEach(x => x.disabled = true);
      await api("/approvals/" + encodeURIComponent(ask.id), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ choice: c }) });
      box.appendChild(h("div", "meta", c === "deny" ? "Denied." : "Allowed."));
    };
    row.appendChild(b);
  }
  box.appendChild(row); $("log").appendChild(box); scroll();
  setTimeout(() => row.querySelectorAll("button").forEach(x => x.disabled = true), (ask.timeout || 70) * 1000);
}

async function send(text) {
  busy = true; $("go").disabled = true; $("orb").classList.add("busy");
  bubble("me", text, "now · here");
  const status = h("div", "status", "thinking…"); $("log").appendChild(status); scroll();
  if (push) {
    api("/notifications", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: "From your phone: " + text, agent: agentName(), mood: "alert" }) }).catch(() => {});
  }
  try {
    const q = new URLSearchParams({ stream: "1", text, profile: agentName() === "default" ? "" : agentName(), source: "companion" });
    const r = await api("/turn?" + q, { method: "POST" });
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line) continue;
        let m; try { m = JSON.parse(line); } catch { continue; }
        if (m.status) status.textContent = m.status;
        if (m.ask) askCard(m.ask);
        if (m.tts && speak) { audioQ.push(m.tts); playNext(); }
        if ("reply" in m) {
          status.remove();
          const b = bubble("bot", m.reply || "(no reply)", label(agentName()) + (m.react ? " · " + m.react : ""));
          if (m.image_b64) { const im = new Image(); im.src = "data:image/jpeg;base64," + m.image_b64; im.onload = scroll; b.insertBefore(im, b.lastChild); }
          shown.add(text + "|" + (m.reply || ""));
        }
      }
    }
  } catch (e) {
    if (e.message !== "401") { status.textContent = "Couldn't reach the relay."; status.style.color = "var(--bad)"; }
  } finally {
    busy = false; $("go").disabled = false; $("orb").classList.remove("busy");
    setTimeout(loadHistory, 1500);
  }
}

$("f").onsubmit = e => { e.preventDefault(); const t = $("t").value.trim(); if (!t || busy) return; $("t").value = ""; $("t").style.height = ""; send(t); };
$("t").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("f").requestSubmit(); } });
$("t").addEventListener("input", e => { e.target.style.height = ""; e.target.style.height = e.target.scrollHeight + "px"; });
$("agent").onchange = () => { localStorage.setItem("agent", agentName()); paint(); };
$("speak").onclick = () => { speak = !speak; localStorage.setItem("speak", speak ? "1" : "0"); paint(); };
$("push").onclick = () => { push = !push; paint(); };
$("lgo").onclick = async () => {
  token = $("tok").value.trim(); if (!token) return;
  try { await loadAgents(); localStorage.setItem("relayToken", token); $("login").classList.remove("show"); start(); }
  catch (e) { if (e.message !== "401") $("lerr").textContent = "Couldn't reach the relay."; }
};
$("tok").addEventListener("keydown", e => { if (e.key === "Enter") $("lgo").click(); });

function start() { loadHistory(); loadCards(); setInterval(() => { if (!busy) loadHistory(); }, 8000); setInterval(loadCards, 60000); }
if (!token) showLogin(); else loadAgents().then(start).catch(() => {});
</script>
</body>
</html>
